name: Android Release

on:
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the APKs to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build signed APKs
    # Dependency releases and releases created by Actions stay as they are.
    # A release created on GitHub receives the APKs; this workflow does not open another one.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'release' &&
         !startsWith(github.event.release.tag_name, 'deps-') &&
         github.event.release.tag_name != 'windows-arm64-libmpv'))
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.daemon.jvm.options=-Xmx2048m,-XX:-UseParallelGC"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Restore Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" ]]; then
            echo "Missing Android signing secrets." >&2
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/key.jks

          {
            printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf 'storeFile=key.jks\n'
          } > android/key.properties

      - name: Verify signing key fingerprint
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail

          keytool -list -v \
            -keystore android/app/key.jks \
            -alias "${ANDROID_KEY_ALIAS}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" > keytool-output.txt

          actual_sha256="$(grep 'SHA256:' keytool-output.txt | head -n 1 | sed 's/.*SHA256: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_sha256="$(printf '%s' "${EXPECTED_CERT_SHA256}" | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          if [[ -n "${expected_sha256}" && "${actual_sha256}" != "${expected_sha256}" ]]; then
            echo "Signing certificate mismatch." >&2
            echo "Expected: ${expected_sha256}" >&2
            echo "Actual:   ${actual_sha256}" >&2
            exit 1
          fi

          echo "Signing certificate SHA-256: ${actual_sha256}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/
          ls -lah dist

      - name: Verify APK signing certificates
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail

          expected_sha256="$(printf '%s' "${EXPECTED_CERT_SHA256}" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          for apk in dist/*.apk; do
            echo "Verifying ${apk}"
            actual_sha256="$("${apksigner}" verify --print-certs "${apk}" | grep 'certificate SHA-256 digest:' | head -n 1 | sed 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [[ "${actual_sha256}" != "${expected_sha256}" ]]; then
              echo "APK signing certificate mismatch for ${apk}." >&2
              echo "Expected: ${expected_sha256}" >&2
              echo "Actual:   ${actual_sha256}" >&2
              exit 1
            fi
          done

      - name: Upload APKs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "No release tag. Create a GitHub release, or pass a tag when running this workflow by hand." >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" dist/*.apk --clobber
