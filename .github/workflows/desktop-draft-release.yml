name: Desktop Release

on:
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the desktop builds to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x64 archive
    # Dependency releases and releases created by Actions stay as they are.
    # A release created on GitHub receives these files; this workflow does not open another one.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'release' &&
         !startsWith(github.event.release.tag_name, 'deps-') &&
         github.event.release.tag_name != 'windows-arm64-libmpv'))
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            curl \
            git \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            make \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            unzip \
            xz-utils \
            zip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Build Linux archive
        run: packaging/linux/build-release.sh

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/gastube-*-linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 installer
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'release' &&
         !startsWith(github.event.release.tag_name, 'deps-') &&
         github.event.release.tag_name != 'windows-arm64-libmpv'))
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          flutter config --no-analytics --enable-windows-desktop
          flutter pub get
          flutter build windows --release
          bash packaging/java/bundle-runtime.sh "build/windows/x64/runner/Release"
          bash packaging/ffmpeg/bundle-ffmpeg.sh "build/windows/x64/runner/Release"
          $version = "${{ steps.app_version.outputs.version }}"
          $numeric = $version -replace '\+', '.'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DVersionInfo=$numeric" `
            "packaging\windows\gastube.iss"
          Get-Item "dist/gastube-$version-windows-x64.exe" | Format-List FullName, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/gastube-*-windows-x64.exe
          if-no-files-found: error

  build-windows-arm64:
    name: Build Windows ARM64 installer
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'release' &&
         !startsWith(github.event.release.tag_name, 'deps-') &&
         github.event.release.tag_name != 'windows-arm64-libmpv'))
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # releases_windows.json has no dart_sdk_arch=arm64 entry, so flutter-action
      # cannot install Flutter 3.47.1 here. Clone the tag and let it fetch the
      # Windows ARM64 Dart SDK.
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-git-windows-arm64-3.47.1

      - name: Clone Flutter
        shell: pwsh
        run: |
          $FlutterRoot = Join-Path $env:RUNNER_TEMP 'flutter'
          if (-not (Test-Path (Join-Path $FlutterRoot 'bin\flutter.bat'))) {
            git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git $FlutterRoot
          }
          git config --global --add safe.directory $FlutterRoot
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $FlutterRoot 'bin')
          Add-Content -Path $env:GITHUB_ENV -Value "FLUTTER_ROOT=$FlutterRoot"

      - name: Precache Flutter
        run: flutter --version

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          # Temurin publishes no JDK 17 for Windows ARM64. Microsoft OpenJDK 17 does.
          distribution: microsoft
          java-version: "17"

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install Inno Setup and 7-Zip
        run: choco install innosetup 7zip --no-progress -y

      - name: Build Windows ARM64 installer
        shell: pwsh
        run: |
          flutter config --no-analytics --enable-windows-desktop
          flutter pub get
          flutter build windows --release
          bash packaging/java/bundle-runtime.sh "build/windows/arm64/runner/Release"
          bash packaging/ffmpeg/bundle-ffmpeg.sh "build/windows/arm64/runner/Release"
          ./packaging/windows/copy-arm64-crt.ps1 -Release "build/windows/arm64/runner/Release"
          $version = "${{ steps.app_version.outputs.version }}"
          $numeric = $version -replace '\+', '.'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DVersionInfo=$numeric" `
            "/DSetupArch=arm64" `
            "packaging\windows\gastube.iss"
          Get-Item "dist/gastube-$version-windows-arm64.exe" | Format-List FullName, Length

      - name: Upload Windows ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/gastube-*-windows-arm64.exe
          if-no-files-found: error

  release:
    name: Publish desktop files
    needs:
      - build-linux
      - build-windows
      - build-windows-arm64
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'release' &&
         !startsWith(github.event.release.tag_name, 'deps-') &&
         github.event.release.tag_name != 'windows-arm64-libmpv'))
    runs-on: ubuntu-26.04

    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \( -name '*.exe' -o -name '*.tar.gz' \) -exec cp -t release-assets {} +
          if find release-assets -type f -name '*.zip' | grep -q .; then
            echo "Refusing to publish a zip. The Windows asset must be the installer exe." >&2
            exit 1
          fi
          if ! find release-assets -type f -name '*-windows-x64.exe' | grep -q .; then
            echo "Windows x64 installer exe is missing." >&2
            exit 1
          fi
          if ! find release-assets -type f -name '*-windows-arm64.exe' | grep -q .; then
            echo "Windows ARM64 installer exe is missing." >&2
            exit 1
          fi
          ls -lah release-assets

      - name: Upload files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "No release tag. Create a GitHub release, or pass a tag when running this workflow by hand." >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* --clobber
