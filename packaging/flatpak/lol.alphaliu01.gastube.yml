  - name: gastube
    buildsystem: simple
    build-options:
      env:
        PUB_CACHE: /run/build/gastube/pub-cache
        FLUTTER_ROOT: /run/build/gastube/flutter-sdk
        PATH: /run/build/gastube/flutter-sdk/bin:/app/jre/bin:/usr/bin
        GASTUBE_MIMALLOC_ARCHIVE: /run/build/gastube/mimalloc-2.1.2.tar.gz
        GASTUBE_SQLITE_SRC: /run/build/gastube/sqlite-src
    build-commands:
      - bash packaging/flatpak/build-app.sh
      - cp -a build/linux/x64/release/bundle/. /app/bin/
      - |
        for size in 16 24 32 48 64 256; do
          install -Dm644 packaging/linux/icons/${size}x${size}/apps/gastube.png /app/share/icons/hicolor/${size}x${size}/apps/lol.alphaliu01.gastube.png
        done
      - install -Dm644 packaging/flatpak/lol.alphaliu01.gastube.desktop /app/share/applications/lol.alphaliu01.gastube.desktop
      - install -Dm644 packaging/flatpak/lol.alphaliu01.gastube.metainfo.xml /app/share/metainfo/lol.alphaliu01.gastube.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/lol.alphaliu01.gastube/LICENSE
    sources:
      - type: dir
        path: ../..
