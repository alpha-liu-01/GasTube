# From-source Flatpak for GasTube. The app checkout below is a local
# directory so this tree can be built before it is published. A Flathub
# submission replaces that source with a git url and commit.
id: lol.alphaliu01.gastube
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: gastube
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download:create
  - --filesystem=xdg-videos:create
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk17/bin/jlink --module-path /usr/lib/sdk/openjdk17/jvm/openjdk-17/jmods --add-modules ALL-MODULE-PATH --output /app/jre --strip-debug --no-man-pages --no-header-files

  - name: ffmpeg
    buildsystem: simple
    # YouTube playback URLs are https. Without a TLS library, this ffmpeg
    # builds the http protocol and not https. libmpv then fails every open,
    # and the player stays at 0:00 on a black frame. Changing quality does
    # not help, because every stream URL is still https. GnuTLS is already
    # in the Freedesktop runtime, so the app does not have to ship it.
    build-commands:
      - ./configure --prefix=/app --enable-shared --disable-static --disable-doc --disable-ffplay --enable-gpl --enable-version3 --enable-pic --enable-gnutls --disable-nvenc --disable-nvdec --disable-cuda --disable-cuvid --disable-ffnvcodec --disable-vulkan
      - make -j$(nproc)
      - make install
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-6.1.1.tar.xz
        sha256: 8684f4b00f94b85461884c3719382f1261f0d9eb3d59640a1f4ac0873616f968

  - name: libass
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  - name: mpv
    buildsystem: meson
    build-options:
      ldflags: -Wl,-rpath,/app/lib
    # A debug build leaves mpv's allocator canaries enabled. mpv_create then
    # aborts in ta_dbg_check_header before the player can start.
    config-opts:
      - -Dbuildtype=release
      - -Db_ndebug=true
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlibplacebo=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Ddvdnav=disabled
      - -Dcdda=disabled
      - -Dsdl2=disabled
      - -Dopenal=disabled
      - -Djack=disabled
      # The sandbox has a PulseAudio socket and no PipeWire socket. With
      # PipeWire enabled, player startup waits in mpv_hook_add while the
      # audio thread stops a PipeWire loop that never connected, and the
      # process aborts (status 134) on some launches.
      - -Dpipewire=disabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dmanpage-build=disabled
      - -Dbuild-date=false
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.35.1.tar.gz
        sha256: 41df981b7b84e33a2ef4478aaf81d6f4f5c8b9cd2c0d337ac142fc20b387d1a9
      # GCC 16 zeroes only the first byte of `union x val = {0}` when the
      # first member is a bool. mpv then frees a garbage pointer in mpv_create.
      - type: patch
        path: mpv-gcc16-union-init.patch

